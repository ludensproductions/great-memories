services:
  great-memories-app-base:
    image: busybox
  great-memories-server:
    extends:
      service: great-memories-app-base
    profiles: !reset []
    image: great-memories-server-dev:latest
    build:
      target: dev-container-server
    env_file: !reset []
    hostname: great-memories-dev
    environment:
      - GREAT_MEMORIES_SERVER_URL=http://127.0.0.1:2283/
    volumes:
      - ${UPLOAD_LOCATION:-upload-devcontainer-volume}${UPLOAD_LOCATION:+/photos}:/data
      - /etc/localtime:/etc/localtime:ro
      - build_cache:/buildcache
      - ../packages/plugin-core:/build/plugins/great-memories-plugin-core
  great-memories-web:
    env_file: !reset []
  great-memories-machine-learning:
    env_file: !reset []
  database:
    env_file: !reset []
    environment: !override
      POSTGRES_PASSWORD: ${DB_PASSWORD-postgres}
      POSTGRES_USER: ${DB_USERNAME-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME-great-memories}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - ${UPLOAD_LOCATION:-postgres-devcontainer-volume}${UPLOAD_LOCATION:+/postgres}:/var/lib/postgresql/data
  redis:
    env_file: !reset []
volumes:
  upload-devcontainer-volume:
  postgres-devcontainer-volume:
