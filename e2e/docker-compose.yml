name: great-memories-e2e

services:
  e2e-auth-server:
    container_name: great-memories-e2e-auth-server
    build:
      context: ../
      dockerfile: packages/e2e-auth-server/Dockerfile
    ports:
      - 2286:2286

  great-memories-server:
    container_name: great-memories-e2e-server
    image: great-memories-server:latest
    build:
      context: ../
      dockerfile: server/Dockerfile
      cache_from:
        - type=registry,ref=ghcr.io/immich-app/immich-server-build-cache:linux-amd64-cc099f297acd18c924b35ece3245215b53d106eb2518e3af6415931d055746cd-main
        - type=registry,ref=ghcr.io/immich-app/immich-server-build-cache:linux-arm64-cc099f297acd18c924b35ece3245215b53d106eb2518e3af6415931d055746cd-main
      args:
        - BUILD_ID=1234567890
        - BUILD_IMAGE=e2e
        - BUILD_SOURCE_REF=e2e
        - BUILD_SOURCE_COMMIT=e2eeeeeeeeeeeeeeeeee
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: great-memories
      GREAT_MEMORIES_MACHINE_LEARNING_ENABLED: 'false'
      GREAT_MEMORIES_TELEMETRY_INCLUDE: all
      GREAT_MEMORIES_ENV: testing
      GREAT_MEMORIES_PORT: '2285'
      GREAT_MEMORIES_IGNORE_MOUNT_CHECK_ERRORS: 'true'
    volumes:
      - ./assets:/assets
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    ports:
      - 2285:2285

  redis:
    container_name: great-memories-e2e-redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    container_name: great-memories-e2e-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    command: -c fsync=off -c shared_preload_libraries=vchord.so -c config_file=/var/lib/postgresql/data/postgresql.conf
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: great-memories
    ports:
      - 5435:5432
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d great-memories']
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 10s
