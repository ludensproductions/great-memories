name: great-memories-e2e

services:
  great-memories-app-base:
    extends:
      file: ../docker/docker-compose.dev.yml
      service: great-memories-app-base

  great-memories-init:
    extends:
      file: ../docker/docker-compose.dev.yml
      service: great-memories-init
    container_name: great-memories-e2e-init

  great-memories-server:
    extends:
      file: ../docker/docker-compose.dev.yml
      service: great-memories-server
    container_name: great-memories-e2e-server
    ports: !reset []
    env_file: !reset []
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: great-memories
      GREAT_MEMORIES_MACHINE_LEARNING_ENABLED: 'false'
      GREAT_MEMORIES_TELEMETRY_INCLUDE: all
      GREAT_MEMORIES_ENV: testing
      GREAT_MEMORIES_PORT: '2285'
      GREAT_MEMORIES_IGNORE_MOUNT_CHECK_ERRORS: 'true'
    volumes:
      - ./assets:/assets
    depends_on:
      great-memories-init:
        condition: service_healthy
      redis:
        condition: service_started
      database:
        condition: service_healthy

  great-memories-web:
    extends:
      file: ../docker/docker-compose.dev.yml
      service: great-memories-web
    container_name: great-memories-e2e-web
    ports: !override
      - 2285:3000
    environment:
      GREAT_MEMORIES_SERVER_URL: http://great-memories-server:2285/
    depends_on:
      great-memories-init:
        condition: service_healthy
    restart: unless-stopped

  redis:
    extends:
      file: ../docker/docker-compose.dev.yml
      service: redis
    container_name: great-memories-e2e-redis

  database:
    extends:
      file: ../docker/docker-compose.dev.yml
      service: database
    container_name: great-memories-e2e-postgres
    command: -c fsync=off -c shared_preload_libraries=vchord.so -c config_file=/var/lib/postgresql/data/postgresql.conf
    env_file: !reset []
    ports: !override
      - 5435:5432
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: great-memories
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d great-memories']
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  model_cache:
  prometheus_data:
  grafana_data:
  build_cache:
  server_node_modules:
  web_node_modules:
  github_node_modules:
  cli_node_modules:
  docs_node_modules:
  e2e_node_modules:
  sdk_node_modules:
  app_node_modules:
  sveltekit:
  coverage:
